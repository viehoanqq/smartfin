name: SmartFin CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  backend-test:
    name: Backend Test (FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        # SỬA Ở ĐÂY: Dùng image có tích hợp sẵn pgvector
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: smartfin_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Create Tables and Run Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+psycopg://postgres:password123@localhost:5434/smartfin_db"
          PYTHONPATH: .
        run: |
          # Bật extension vector trước
          export PGPASSWORD=password123
          psql -h localhost -p 5434 -U postgres -d smartfin_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          
          # Chạy migration để sinh 16 bảng
          alembic upgrade head
          
          # Test API
          pytest -v

  frontend-test:
    name: Frontend Build & Test (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Build / Lint / Test
        working-directory: ./frontend
        run: |
          npm run build